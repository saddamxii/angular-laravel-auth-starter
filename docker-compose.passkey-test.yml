name: auth-starter-passkey-test

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: auth_starter_passkey_test
      MYSQL_USER: auth_starter_passkey_test
      MYSQL_PASSWORD: auth_starter_passkey_test
      MYSQL_ROOT_PASSWORD: auth_starter_passkey_test_root
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u auth_starter_passkey_test -pauth_starter_passkey_test -D auth_starter_passkey_test -e 'SELECT 1' --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - passkey_test_mysql_data:/var/lib/mysql
    networks: [passkey_test]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: https://frontend.test
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: auth_starter_passkey_test
      DB_USERNAME: auth_starter_passkey_test
      DB_PASSWORD: auth_starter_passkey_test
      CACHE_STORE: array
      SESSION_DRIVER: database
      MAIL_MAILER: log
      PASSKEYS_USER_HANDLE_SECRET: passkey-integration-test-secret
      WEBAUTHN_RP_ID: frontend.test
      WEBAUTHN_ORIGIN: https://frontend.test
      RUN_MIGRATIONS: true
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/up\") === false ? 1 : 0);'"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [passkey_test]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.passkey-test
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks:
      passkey_test:
        aliases:
          - frontend.test

  passkey-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    environment:
      PLAYWRIGHT_INTEGRATION: "true"
      PLAYWRIGHT_BASE_URL: https://frontend.test
    command: ["sh", "-c", "npm run lint && npm run test && npm run e2e -- --project=chromium"]
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
    networks: [passkey_test]

networks:
  passkey_test:
    driver: bridge

volumes:
  passkey_test_mysql_data:
