<main class="auth-shell"><section class="auth-card">
  <a routerLink="/login">← {{ i18n.t('auth.sign_in') }}</a><h1>{{ i18n.t('auth.reset_password') }}</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline" floatLabel="always"><mat-label>{{ i18n.t('auth.new_password') }}</mat-label><mat-icon matPrefix>lock_outline</mat-icon><input matInput type="password" formControlName="password" autocomplete="new-password" /></mat-form-field>
    <mat-form-field appearance="outline" floatLabel="always"><mat-label>{{ i18n.t('auth.confirm_password') }}</mat-label><mat-icon matPrefix>lock_reset</mat-icon><input matInput type="password" formControlName="password_confirmation" autocomplete="new-password" /></mat-form-field>
    @if (message()) { <p role="status">{{ message() }}</p> }
    <button mat-flat-button type="submit" [disabled]="form.invalid || loading()">{{ loading() ? 'Resetting…' : i18n.t('auth.reset_password') }}</button>
  </form>
</section></main>
