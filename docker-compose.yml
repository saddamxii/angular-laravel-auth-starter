services:
  mysql:
    image: mysql:8.4
    container_name: auth_starter_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auth_starter}
      MYSQL_USER: ${MYSQL_USER:-auth_starter}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - auth_starter

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth_starter_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-auth_starter}
      DB_USERNAME: ${MYSQL_USER:-auth_starter}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
    networks:
      - auth_starter

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auth_starter_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - auth_starter

networks:
  auth_starter:
    driver: bridge

volumes:
  mysql_data:
