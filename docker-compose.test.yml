services:
  mysql-test:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: auth_starter_test
      MYSQL_USER: auth_starter_test
      MYSQL_PASSWORD: auth_starter_test
      MYSQL_ROOT_PASSWORD: auth_starter_test_root
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u auth_starter_test -pauth_starter_test -D auth_starter_test -e 'SELECT 1' --silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [auth_starter_test]

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost:4200
      JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_TTL: 15
      JWT_REFRESH_TTL: 20160
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: auth_starter_test
      DB_USERNAME: auth_starter_test
      DB_PASSWORD: auth_starter_test
      CACHE_STORE: array
      SESSION_DRIVER: database
      MAIL_MAILER: log
      PASSKEYS_USER_HANDLE_SECRET: testing-passkey-secret
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:4200
      RUN_MIGRATIONS: false
    depends_on:
      mysql-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        stage() { echo "[BACKEND-TEST] $1"; }
        run_stage() {
          name="$$1"
          shift
          stage "START $$name"
          timeout 30s "$$@"
          rc=$$?
          if [ "$$rc" -ne 0 ]; then
            echo "[BACKEND-TEST] FAIL $$name (exit=$$rc)" >&2
            exit "$$rc"
          fi
          stage "PASS $$name"
        }
        stage "START database connectivity"
        timeout 30s php artisan tinker --execute='DB::connection()->getPdo(); echo "DB_OK\n";' || { echo "[BACKEND-TEST] FAIL database connectivity" >&2; exit 1; }
        stage "PASS database connectivity"
        run_stage "migrations and seed" php artisan migrate:fresh --seed --force
        run_stage "laravel bootstrap" php artisan about
        run_stage "test discovery" php artisan test --list-tests
        stage "START phpunit"
        timeout 180s vendor/bin/phpunit --configuration phpunit.xml --testdox --colors=never
        rc=$$?
        if [ "$$rc" -ne 0 ]; then
          echo "[BACKEND-TEST] FAIL phpunit (exit=$$rc)" >&2
          exit "$$rc"
        fi
        stage "PASS phpunit"
        stage "ALL BACKEND TEST STAGES PASSED"
    networks: [auth_starter_test]

networks:
  auth_starter_test:
    driver: bridge
