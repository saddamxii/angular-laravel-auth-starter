name: Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'ci/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f docker-compose.test.yml config
      - name: Build backend test image
        run: docker compose -f docker-compose.test.yml build backend-test
      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d mysql-test
      - name: Wait for database health
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' auth_starter_mysql_test 2>/dev/null || true)
            echo "[CI] MySQL health: ${status:-missing}"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "[CI] ERROR: MySQL did not become healthy within 120 seconds" >&2
          docker logs auth_starter_mysql_test || true
          exit 1
      - name: Database connectivity diagnostic
        run: docker compose -f docker-compose.test.yml run --rm --no-deps backend-test sh -c "timeout 30s php artisan tinker --execute='DB::connection()->getPdo(); echo \"DB_OK\\n\";'"
      - name: Migrations and seed diagnostic
        run: docker compose -f docker-compose.test.yml run --rm backend-test sh -c "timeout 60s php artisan migrate:fresh --seed --force"
      - name: Laravel bootstrap diagnostic
        run: docker compose -f docker-compose.test.yml run --rm --no-deps backend-test sh -c "timeout 30s php artisan about"
      - name: Test discovery diagnostic
        run: docker compose -f docker-compose.test.yml run --rm --no-deps backend-test sh -c "timeout 30s php artisan test --list-tests"
      - name: PHPUnit
        run: docker compose -f docker-compose.test.yml run --rm --no-deps backend-test sh -c "timeout 180s vendor/bin/phpunit --configuration phpunit.xml --testdox --colors=never"
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans

  frontend:
    name: Frontend lint, unit and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose -f docker-compose.frontend-test.yml config
      - name: Run frontend checks
        run: docker compose -f docker-compose.frontend-test.yml run --rm frontend-test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.frontend-test.yml down -v --remove-orphans

  production:
    name: Production image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: docker compose -f docker-compose.yml build --pull
